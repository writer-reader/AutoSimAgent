# model.yaml —— LLM 行为参数。连接信息（API key / base_url / 模型名）全部在 .env。
version: "1.0"
provider: "deepseek"              # 仅作标签，实际走 OpenAI 兼容接口
api_key_env: "LLM_API_KEY"
base_url_env: "LLM_BASE_URL"
default_llm_env: "LLM_DEFAULT_MODEL"
planner_llm_env: "LLM_PLANNER_MODEL"
request_timeout_s: 150           # 单次 HTTP 尝试超时；SDK 层另有 sdk_max_retries，超时快速失败走 L1-L5 回滚
sdk_max_retries: 1               # OpenAI SDK 内部自动重试次数（默认 2 会把长超时静默放大数倍，务必显式配置）
max_structured_retries: 2        # 结构化输出校验失败的回喂重试次数
extra_body:                      # 透传给 chat.completions 的额外参数（供应商专属，可整段删掉）
  enable_thinking: false         # DashScope 兼容接口：抽取/规划任务关闭思考模式，大幅降低延迟
temperature:
  planner: 0.2
  extractor: 0.0
  codegen: 0.1
