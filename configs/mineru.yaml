# mineru.yaml 配置文件，提供对应模块的可调参数。
version: "1.0"
backend: "api"
api_base_url: "https://mineru.net"
api_key_env: "MINERU_API_KEY"
model_version: null          # 留空用服务端默认；可设 "v2" 等
enable_formula: true
enable_table: true
max_pdf_size_mb: 100
timeout_s: 600
poll_interval_s: 5
output_formats:
  - markdown
  - json
  - images
retry:
  max_attempts: 2
  backoff_s: 5
