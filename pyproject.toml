# 项目构建、依赖和 pytest 配置入口。
[project]
name = "control-agent"
version = "0.1.0"
description = "Agentic backend for control-paper understanding, RAG, MATLAB and Simulink workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "PyYAML>=6",
  "uvicorn>=0.27",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "mcp>=1.0",
  "langgraph>=0.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
