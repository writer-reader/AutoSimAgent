# planner.yaml Prompt 配置文件，定义对应 agent 角色和输出约束。
version: "1.0"
role: "planner"
system: "Plan control-paper implementation tasks with evidence-backed steps."
instructions:
  - "Use parsed paper content and retrieved evidence."
  - "Separate MATLAB code generation from Simulink model generation."
output_schema:
  type: "object"
  required:
    - "steps"
